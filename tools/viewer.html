<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>モデルビューア（開発用）</title>
  <style>
    body { margin: 0; background: #1a1a20; color: #eee; font-family: sans-serif; overflow: hidden; }
    #info { position: fixed; left: 8px; top: 8px; font-size: 13px; background: rgba(0,0,0,.5); padding: 6px 10px; }
    .label { position: fixed; transform: translate(-50%, 0); font-size: 13px; background: rgba(0,0,0,.6); padding: 2px 8px; white-space: nowrap; }
  </style>
  <script type="importmap">{ "imports": { "three": "../js/lib/three.module.min.js", "three/addons/": "../js/lib/addons/" } }</script>
</head>
<body>
<div id="info">マシン・キャラの見た目確認用（ゲームには含まれません）。?seal=0〜4 でアルファの封印段階</div>
<script type="module">
import * as THREE from 'three';
import { loadModels, getModel } from '../js/core/assets.js';
import { buildMachineModel, animateMachine } from '../js/models/mech.js';
import { MACHINES } from '../js/data/machines.js';

const seal = Number(new URLSearchParams(location.search).get('seal') ?? 1);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a32);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-4, 8, 6); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: 0x3a3a44 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 3.2, 13); cam.lookAt(0, 1.3, 0);
await loadModels();
const ids = ['hound', 'falco', 'goliath', 'omega', 'alpha'];
const objs = [];
ids.forEach((id, i) => {
  const def = MACHINES[id];
  const sealed = id === 'alpha' && seal < 1;
  const o = buildMachineModel({ parts: def.parts, colors: sealed ? def.brokenColors : def.colors, weapons: def.weapons, glow: id === 'alpha' ? def.seal[seal].glow : undefined });
  o.position.set((i - 2) * 3.2, 0, 0);
  o.rotation.y = 0.5;
  scene.add(o); objs.push(o);
  const l = document.createElement('div'); l.className = 'label'; l.textContent = def.name; document.body.appendChild(l);
  o.userData.label = l;
});
['ren', 'shion', 'gina'].forEach((id, i) => {
  const o = getModel(id); o.position.set(-6 + i * 1.2, 0, 3); o.scale.setScalar(1.2); scene.add(o);
});
let t = 0;
r.setAnimationLoop(() => {
  t += 0.016;
  for (const o of objs) {
    o.rotation.y = Number(new URLSearchParams(location.search).get('rot') ?? 0.35); animateMachine(o, t, 0);
    const v = o.position.clone().setY(-0.3).project(cam);
    o.userData.label.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`; o.userData.label.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
  }
  r.render(scene, cam);
});
</script>
</body>
</html>
