# GitHub Pages へ公開する（ビルド不要の静的サイトなので、そのままアップロードする）
# リポジトリの Settings → Pages → Source を「GitHub Actions」にすると動く
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html css js models assets .nojekyll _site/
      # ブラウザが古いファイルを使い続けないように、公開のたびに読み込むファイル名に版番号を付ける
      - name: Cache busting
        run: |
          V=${GITHUB_SHA::8}
          find _site/js -name '*.js' -not -path '*/lib/*' -exec sed -i -E "s#((from|import) *\(?'\.{1,2}/[^']+\.js)'#\1?v=$V'#g" {} +
          sed -i -E "s#(src=\"js/main\.js)\"#\1?v=$V\"#; s#(href=\"css/style\.css)\"#\1?v=$V\"#" _site/index.html
          grep -n "main.js\|style.css" _site/index.html
          grep -rn "?v=" _site/js/main.js | head -3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
