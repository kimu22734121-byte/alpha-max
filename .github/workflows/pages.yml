# GitHub Pages へ公開する（ビルド不要の静的サイトなので、そのままアップロードする）
# リポジトリの Settings → Pages → Source を「GitHub Actions」にすると動く
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html css js models assets .nojekyll _site/
      # キャッシュ対策：index.html の JS・CSS には ?v=日付時刻 が付いている（tools/bump-version.sh で更新）。
      # JS の中から読み込むファイルにも、公開のたびにコミット番号の版番号を付ける
      - name: Cache busting
        run: |
          V=${GITHUB_SHA::8}
          find _site/js -name '*.js' -not -path '*/lib/*' -exec sed -i -E "s#((from|import) *\(?'\.{1,2}/[^']+\.js)'#\1?v=$V'#g" {} +
          grep -n "main.js\|style.css" _site/index.html
          grep -rn "?v=" _site/js/main.js | head -3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # アップロード直後は GitHub 側でまだ見つからないことがある（"No artifacts named github-pages"）。少し待ってから公開し、失敗したらもう一度だけやり直す
      - name: Wait for artifact
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
